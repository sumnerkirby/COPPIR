<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>COPPIR — Starting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000a00;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .brand {
      font-size: 48px;
      font-weight: bold;
      color: #00ff41;
      letter-spacing: 12px;
    }
    .name-line {
      font-size: 10px;
      color: #336633;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.9;
    }
    .name-line:first-of-type { margin-top: 14px; }
    .bar-wrap {
      width: 200px;
      height: 2px;
      background: #001400;
      margin-top: 32px;
      border-radius: 1px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: 30%;
      background: #00ff41;
      border-radius: 1px;
      animation: sweep 1.4s ease-in-out infinite;
    }
    @keyframes sweep {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(450%); }
    }
    .status {
      font-size: 10px;
      color: #336633;
      letter-spacing: 3px;
      margin-top: 16px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="brand">COPPIR</div>
  <div class="name-line">Common Operational Picture</div>
  <div class="name-line">Program for Incident Response</div>
  <div class="bar-wrap"><div class="bar"></div></div>
  <div class="status" id="status-txt">Server starting...</div>

  <script>
    const STATUS = document.getElementById('status-txt');
    let attempt = 0;

    function check() {
      attempt++;
      if (attempt > 3) STATUS.textContent = 'Server starting — please wait...';
      fetch('http://localhost:8000/', { cache: 'no-store' })
        .then(r => {
          if (r.ok || r.type === 'opaque') {
            STATUS.textContent = 'Ready — connecting...';
            window.location.href = 'http://localhost:8000/';
          } else {
            setTimeout(check, 600);
          }
        })
        .catch(() => setTimeout(check, 600));
    }

    setTimeout(check, 800);
  </script>
</body>
</html>
