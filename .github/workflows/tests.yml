name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor ARCHITECTURE.md claims support for; 3.13 catches
        # breakage on newer interpreters.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # The browser suite runs in its own job; keeping it out of here means
        # the matrix stays fast and a failure says which layer broke.
        run: pytest --ignore=tests/browser

  browser:
    name: browser
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Chromium
        # --with-deps pulls the system libraries the runner does not ship.
        run: playwright install --with-deps chromium

      - name: Run browser tests
        run: pytest tests/browser

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
